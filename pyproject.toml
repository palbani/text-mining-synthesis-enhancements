[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "synthesis-enhancements"
version = "1.0.0"
description = "Enhanced text-mining synthesis with transformer models, parallel processing, and model versioning"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "CederGroup Enhanced", email = "cedergroup-ml-team@lbl.gov"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = ["materials science", "text mining", "NLP", "transformers", "synthesis"]

dependencies = [
    "torch>=2.0.0",
    "transformers>=4.30.0",
    "sentence-transformers>=2.2.0",
    "spacy>=3.5.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.2.0",
    "sympy>=1.12",
    "regex>=2023.0.0",
    "pubchempy>=1.0.4",
    "onnx>=1.14.0",
    "onnxruntime>=1.15.0",
    "mlflow>=2.5.0",
    "pydantic>=2.0.0",
    "tqdm>=4.65.0",
    "joblib>=1.3.0",
    "aiohttp>=3.8.0",
    "asyncio-pool>=0.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.4.0",
    "flake8>=6.0.0",
]
[project.urls]
Homepage = "https://github.com/CederGroupHub/text-mined-synthesis_public"
Documentation = "https://github.com/CederGroupHub/text-mined-synthesis_public/docs"
Repository = "https://github.com/CederGroupHub/text-mined-synthesis_public"

[tool.setuptools.packages.find]
where = ["."]
include = ["synthesis_enhancements*"]

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311']

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["synthesis_enhancements/tests"]
